<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 - 포워딩 견적</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f4f7fb;color:#172033}.hidden{display:none!important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#17263e}.box{background:#fff;padding:28px;border-radius:15px;width:380px}.box h1{margin-top:0}label{display:block;font-size:12px;font-weight:800;color:#667085;margin:12px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #d5dce7;border-radius:8px}.btn{border:0;border-radius:8px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#315bb5;color:#fff}.secondary{background:#edf2f7}.app{display:flex;min-height:100vh}.side{position:fixed;width:220px;top:0;bottom:0;background:#152137;color:#fff;padding:22px}.side button{display:block;width:100%;border:0;background:transparent;color:#c5cfdd;text-align:left;padding:12px;border-radius:8px;margin-top:4px}.side button.active,.side button:hover{background:#263750;color:#fff}.main{margin-left:220px;width:calc(100% - 220px);padding:26px}.top{display:flex;justify-content:space-between;align-items:center}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card,.panel{background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:17px}.num{font-size:26px;font-weight:900;margin-top:7px}.table{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px;white-space:nowrap}.click{cursor:pointer}.badge{padding:5px 8px;border-radius:99px;background:#eef2ff;color:#315bb5;font-weight:800;font-size:12px}.detail{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.span{grid-column:1/-1}.cost{display:grid;grid-template-columns:1fr 150px 60px;gap:8px;margin:7px 0}.total{font-size:24px;font-weight:900}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.muted{color:#718096;font-size:13px}@media(max-width:800px){.cards,.detail{grid-template-columns:1fr 1fr}.side{width:170px}.main{margin-left:170px;width:calc(100% - 170px)}}@media(max-width:560px){.cards,.detail{grid-template-columns:1fr}.side{position:static;width:100%;height:auto}.app{display:block}.main{margin-left:0;width:100%}}
</style></head><body>
<div id="login" class="login"><div class="box"><h1>관리자 로그인</h1><div class="muted">Supabase Auth를 사용하는 실제 관리자 로그인</div><label>이메일</label><input id="email" type="email"><label>비밀번호</label><input id="pw" type="password"><button class="btn primary" style="width:100%;margin-top:15px" onclick="login()">로그인</button><p id="err" style="color:#b42318;font-size:13px"></p></div></div>
<div id="app" class="app hidden"><aside class="side"><h2>🚢 Forwarding</h2><button class="active" onclick="showList()">견적문의</button><button onclick="logout()">로그아웃</button></aside><main class="main">
<div id="list"><div class="top"><div><h1>견적문의</h1><div class="muted">실제 DB에 저장된 고객 문의</div></div><button class="btn secondary" onclick="loadQuotes()">새로고침</button></div>
<div class="cards"><div class="card">전체<div class="num" id="all">0</div></div><div class="card">답변대기<div class="num" id="wait">0</div></div><div class="card">발송<div class="num" id="sent">0</div></div><div class="card">확정<div class="num" id="done">0</div></div></div>
<div class="panel"><div class="table" id="table"></div></div></div>
<div id="detail" class="hidden"><div class="top"><div><h1 id="title"></h1><div id="sub" class="muted"></div></div><button class="btn secondary" onclick="showList()">← 목록</button></div>
<div class="panel" id="info"></div><div class="panel"><h2>견적 작성</h2><div id="costs"></div><button class="btn secondary" onclick="addCost()">+ 비용 항목</button><div class="detail" style="margin-top:15px"><div><label>통화</label><select id="currency"><option>USD</option><option>KRW</option><option>EUR</option></select></div><div><label>마진</label><input id="margin" type="number" value="0" oninput="calc()"></div><div><label>유효기간</label><input id="valid" type="date"></div><div class="span"><label>고객 전달 메모</label><textarea id="qmemo" rows="3"></textarea></div></div><div class="actions"><b style="margin-right:auto">총액 <span id="total" class="total">0</span></b><button class="btn primary" onclick="saveQuote()">견적 저장 / 발송</button></div></div></div>
</main></div>
<script>
let cfg,client,current;
async function init(){cfg=await (await fetch('/api/config')).json();if(!cfg.supabaseUrl)return;const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=async()=>{client=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);const {data:{session}}=await client.auth.getSession();if(session)enter();};document.head.appendChild(s)}
async function login(){let {error}=await client.auth.signInWithPassword({email:email.value,password:pw.value});if(error){err.textContent=error.message;return}enter()}
async function logout(){await client.auth.signOut();location.reload()}
function enter(){loginDiv=false;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadQuotes()}
function showList(){document.getElementById('detail').classList.add('hidden');document.getElementById('list').classList.remove('hidden');loadQuotes()}
async function loadQuotes(){const {data,error}=await client.from('quote_inquiries').select('*').order('created_at',{ascending:false});if(error)return alert(error.message);let a=data||[];all.textContent=a.length;wait.textContent=a.filter(x=>x.status==='견적작성').length;sent.textContent=a.filter(x=>x.status==='견적발송').length;done.textContent=a.filter(x=>x.status==='확정').length;
table.innerHTML='<table><tr><th>문의번호</th><th>회사</th><th>구간</th><th>운송</th><th>상태</th><th>접수일</th></tr>'+a.map(x=>`<tr class="click" onclick="openQuote('${x.id}')"><td>${x.inquiry_no}</td><td>${x.company}</td><td>${x.origin} → ${x.dest}</td><td>${x.mode}/${x.service}</td><td><span class="badge">${x.status}</span></td><td>${new Date(x.created_at).toLocaleString('ko-KR')}</td></tr>`).join('')+'</table>'}
async function openQuote(id){const {data,error}=await client.from('quote_inquiries').select('*').eq('id',id).single();if(error)return alert(error.message);current=data;list.classList.add('hidden');detail.classList.remove('hidden');title.textContent=current.inquiry_no+' · '+current.company;sub.textContent=current.origin+' → '+current.dest+' · '+current.mode+' / '+current.service;
info.innerHTML='<h2>고객 상세정보</h2><div class="detail"><div><b>담당자</b><br>'+current.name+'</div><div><b>연락처</b><br>'+current.phone+'</div><div><b>이메일</b><br>'+current.email+'</div><div><b>인코텀즈</b><br>'+current.inc+'</div><div><b>화물</b><br>'+ (current.cargo||'-')+'</div><div><b>수량/중량</b><br>'+ (current.qty||'-')+' / '+(current.weight||'-')+'kg</div><div><b>CBM</b><br>'+ (current.cbm||'-')+'</div><div><b>출항일</b><br>'+ (current.etd||'-')+'</div><div class="span"><b>요청사항</b><br>'+ (current.memo||'-')+'</div></div>';
currency.value=current.currency||'USD';margin.value=current.margin||0;valid.value=current.valid_until||'';qmemo.value=current.quote_memo||'';renderCosts();calc()}
function renderCosts(){let a=current.costs||[];costs.innerHTML=a.map((c,i)=>`<div class="cost"><input value="${c.name}" oninput="current.costs[${i}].name=this.value"><input type="number" value="${c.amount}" oninput="current.costs[${i}].amount=this.value;calc()"><button class="btn secondary" onclick="current.costs.splice(${i},1);renderCosts();calc()">삭제</button></div>`).join('')}
function addCost(){current.costs=current.costs||[];current.costs.push({name:'',amount:0});renderCosts()}
function calc(){let n=(current.costs||[]).reduce((a,c)=>a+Number(c.amount||0),0)+Number(margin.value||0);total.textContent=n.toLocaleString()+' '+currency.value}
async function saveQuote(){const patch={costs:current.costs||[],currency:currency.value,margin:Number(margin.value||0),valid_until:valid.value||null,quote_memo:qmemo.value,status:'견적발송'};const {error}=await client.from('quote_inquiries').update(patch).eq('id',current.id);if(error)return alert(error.message);current={...current,...patch};alert('견적이 저장되었습니다.');}
init();
</script></body></html>
