<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>포워딩 운송 견적문의 | 와이드해운</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172033;font-family:Arial,"Noto Sans KR",sans-serif}.site{max-width:1180px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 0 1px #dbe2ea}.header{height:86px;display:flex;align-items:center;justify-content:space-between;padding:0 38px;border-bottom:1px solid #e1e6ed}.logo{display:block;width:250px;height:auto}.nav{display:flex;gap:34px;align-items:center}.nav a{font-size:14px;font-weight:800;color:#344054;text-decoration:none;padding:32px 0 27px;border-bottom:3px solid transparent}.nav a.active{color:#123b78;border-bottom-color:#123b78}.hero{position:relative;overflow:hidden;background:#071b43;color:#fff;min-height:245px;padding:44px 50px;display:flex;align-items:center}.hero h1{font-size:34px;letter-spacing:-1.5px;margin:0 0 14px}.hero p{margin:0;font-size:16px;line-height:1.75;color:#e9eef8}.hero-art{position:absolute;right:0;bottom:0;width:440px;height:190px;object-fit:cover;object-position:center;opacity:.9}.content{padding:20px 22px 60px;background:linear-gradient(#f7f9fc,#f3f6fa)}.panel{background:#fff;border:1px solid #e1e7ef;border-radius:16px;padding:26px;margin-top:14px;box-shadow:0 4px 16px rgba(16,38,67,.04)}h2{font-size:22px;margin:0 0 22px;color:#102b56}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:800;color:#344054;margin-bottom:7px}input,select,textarea{width:100%;padding:13px 14px;border:1px solid #d4dce7;border-radius:8px;background:#fff;color:#172033;font-size:14px;outline:none}input:focus,select:focus,textarea:focus{border-color:#1e5aa8;box-shadow:0 0 0 3px rgba(30,90,168,.08)}textarea{resize:vertical}.notice{background:#f1f6fd;padding:14px 16px;border-radius:9px;color:#31518f;font-size:13px;line-height:1.6}.agree{margin-top:14px!important;font-weight:500!important;display:flex;align-items:center;gap:8px}.agree input{width:auto}.row{display:flex;justify-content:flex-end;margin-top:20px}.btn{border:0;border-radius:8px;padding:13px 24px;font-weight:900;cursor:pointer;font-size:14px}.primary{background:#123b78;color:#fff}.primary:hover{background:#0c2d5d}.success{text-align:center;padding:50px}.code{font-size:25px;color:#123b78;font-weight:900;margin:12px}@media(max-width:800px){.header{height:auto;padding:18px 20px;display:block}.logo{width:210px;margin-bottom:12px}.nav{gap:18px;overflow:auto}.nav a{padding:8px 0;border-bottom-width:2px;white-space:nowrap}.hero{padding:34px 26px;min-height:210px}.hero h1{font-size:28px}.hero-art{right:-70px;opacity:.45;width:440px;height:180px}.content{padding:12px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.panel{padding:22px}.site{width:100%}}
</style></head><body><div class="site"><header class="header"><img class="logo" src="/logo.png" alt="와이드해운 로고"><nav class="nav"><a href="#form" class="active">운송 견적문의</a></nav></header><main id="form"><section class="hero"><div><h1>포워딩 운송 견적문의</h1><p>운송 정보를 입력해 주세요.<br>담당자가 확인 후 견적을 안내드립니다.</p></div><img class="hero-art" src="/hero-logistics.png" alt="해상·항공·육상 물류 일러스트"></section><div class="content"><section class="panel"><h2>고객 정보</h2><div class="grid"><div><label>회사명 *</label><input id="company" placeholder="회사명을 입력하세요"></div><div><label>담당자명 *</label><input id="name" placeholder="담당자명을 입력하세요"></div><div><label>연락처 *</label><input id="phone" placeholder="연락처를 입력하세요"></div><div><label>이메일 *</label><input id="email" type="email" placeholder="이메일을 입력하세요"></div></div></section><section class="panel"><h2>운송 정보</h2><div class="grid"><div><label>출발지 *</label><input id="origin" placeholder="BUSAN"></div><div><label>도착지 *</label><input id="dest" placeholder="LOS ANGELES"></div><div><label>운송</label><select id="mode"><option>해상</option><option>항공</option></select></div><div><label>서비스</label><select id="service"><option>FCL</option><option>LCL</option><option>특송</option></select></div><div><label>화물</label><input id="cargo" placeholder="화물 종류"></div><div><label>수량</label><input id="qty" placeholder="수량"></div><div><label>중량(kg)</label><input id="weight" placeholder="중량"></div><div><label>CBM</label><input id="cbm" placeholder="CBM"></div><div><label>인코텀즈</label><select id="inc"><option>FOB</option><option>CIF</option><option>EXW</option><option>DDP</option><option>FCA</option></select></div><div><label>희망 출항일</label><input id="etd" type="date"></div><div class="full"><label>요청사항</label><textarea id="memo" rows="5" placeholder="추가 요청사항을 입력해주세요."></textarea></div></div></section><section class="panel"><h2>개인정보 수집 및 이용</h2><div class="notice">견적문의 접수 및 답변을 위해 입력하신 정보를 이용합니다. 실제 운영 전 개인정보 처리방침과 보관기간을 회사 정책에 맞게 확정하세요.</div><label class="agree"><input id="agree" type="checkbox"> 개인정보 수집 및 이용에 동의합니다. *</label><div class="row"><button class="btn primary" onclick="submitQuote()">견적문의 접수</button></div></section></div></main><section id="done" class="panel success" style="display:none"><div style="font-size:40px">✓</div><h2>문의가 접수되었습니다.</h2><div id="code" class="code"></div><p>담당자가 확인 후 연락드리겠습니다.</p></section></div><script>
let cfg;async function getCfg(){try{const r=await fetch('/api/config');if(!r.ok)throw new Error('환경설정 API 오류: HTTP '+r.status);cfg=await r.json();}catch(err){console.error('환경설정 불러오기 실패:',err);cfg=null}}async function submitQuote(){const ids=['company','name','phone','email','origin','dest'];if(ids.some(id=>!document.getElementById(id).value.trim()))return alert('필수 항목을 입력해주세요.');if(!document.getElementById('agree').checked)return alert('개인정보 수집 및 이용에 동의해주세요.');if(!cfg||!cfg.supabaseUrl||!cfg.supabasePublishableKey)return alert('Supabase 연결 설정을 확인해주세요. 잠시 후 다시 시도해주세요.');const payload={company:company.value,name:name.value,phone:phone.value,email:email.value,origin:origin.value,dest:dest.value,mode:mode.value,service:service.value,cargo:cargo.value,qty:qty.value,weight:weight.value,cbm:cbm.value,inc:inc.value,etd:etd.value||null,memo:memo.value,status:'견적작성'};try{const r=await fetch(cfg.supabaseUrl+'/rest/v1/quote_inquiries',{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.supabasePublishableKey,'Prefer':'return=minimal'},body:JSON.stringify(payload)});const raw=await r.text();let result={};try{result=raw?JSON.parse(raw):{}}catch(e){result={message:raw}}if(!r.ok){console.error('견적문의 접수 실패:',r.status,result);const detail=result.message||result.error_description||result.error||raw||('HTTP '+r.status);return alert('접수 중 오류가 발생했습니다.\n['+r.status+'] '+detail)}document.getElementById('form').style.display='none';document.getElementById('done').style.display='block';document.getElementById('code').textContent='접수 완료'}catch(err){console.error('견적문의 네트워크 오류:',err);alert('서버에 연결하지 못했습니다.\n'+(err.message||err))}}getCfg();</script></body></html>
