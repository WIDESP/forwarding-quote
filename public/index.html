<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>포워딩 운송 견적문의 | 와이드해운</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root {
    --primary: #0F4C81;
    --primary-hover: #093760;
    --bg-gray: #F1F5F9;
    --border: #CBD5E1;
    --border-focus: #0F4C81;
    --text-main: #1E293B;
    --text-sub: #64748B;
    --card-bg: #FFFFFF;
    --danger: #EF4444;
  }
  
  * { box-sizing: border-box; font-family: "Pretendard", -apple-system, sans-serif; }
  body { margin: 0; background: var(--bg-gray); color: var(--text-main); padding: 40px 16px; }
  
  .container { max-width: 820px; margin: 0 auto; }
  .logo-box { text-align: center; margin-bottom: 28px; }
  .logo-box img { height: 72px; object-fit: contain; }
  
  .card { background: var(--card-bg); border-radius: 20px; border: 1px solid #E2E8F0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); padding: 40px; margin-bottom: 20px; }
  
  .header-group { margin-bottom: 32px; text-align: center; }
  .header-group h1 { font-size: 28px; font-weight: 800; color: #0F4C81; margin: 0; letter-spacing: -0.5px; }
  .header-group p { color: var(--text-sub); font-size: 15px; margin-top: 12px; line-height: 1.6; }
  
  .header-title-wrapper {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 8px;
  }

  .char-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    animation: floatChar 3s ease-in-out infinite;
  }
  .char-left { animation-delay: 0s; width: 130px; height: 70px; }
  .char-left img { width: 100%; height: 100%; object-fit: contain; }
  .char-right { animation-delay: 1.5s; width: 90px; height: 50px; }
  .char-right img { width: 100%; height: 100%; object-fit: contain; }

  @keyframes floatChar {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .section-title { font-size: 16px; font-weight: 700; color: #0F172A; margin: 28px 0 16px; display: flex; align-items: center; gap: 8px; }
  .section-title::before { content: ''; display: inline-block; width: 4px; height: 16px; background: var(--primary); border-radius: 2px; }

  .segment-control { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .segment-control input { display: none; }
  .segment-control label {
    text-align: center; padding: 16px 12px; border: 1.5px solid var(--border); border-radius: 12px;
    cursor: pointer; font-size: 15px; font-weight: 600; color: var(--text-sub); background: #FFF; transition: all 0.2s ease;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .segment-control input:checked + label {
    border-color: var(--primary); background: #F0F6FF; color: var(--primary); font-weight: 700; box-shadow: 0 2px 8px rgba(15,76,129,0.12);
  }

  .type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
  .type-grid input { display: none; }
  .type-grid label {
    text-align: center; padding: 12px 8px; border: 1.5px solid var(--border); border-radius: 10px;
    cursor: pointer; font-size: 13px; font-weight: 600; color: #475569; background: #FFF; transition: all 0.2s;
  }
  .type-grid input:checked + label {
    border-color: var(--primary); background: #F0F6FF; color: var(--primary); font-weight: 700;
  }

  .service-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .service-grid input { display: none; }
  .service-grid label {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 14px 10px; border: 1.5px solid var(--border); border-radius: 12px; cursor: pointer;
    background: #FFF; font-size: 14px; font-weight: 600; color: #334155; transition: all 0.2s;
    text-align: center; gap: 4px;
  }
  .service-grid label span.sub-text { font-size: 11px; color: #94A3B8; font-weight: 400; }
  .service-grid input:checked + label {
    border-color: var(--primary); background: #F0F6FF; color: var(--primary); font-weight: 700;
  }
  .service-grid input:checked + label span.sub-text { color: var(--primary); }

  .trucking-address-box {
    background: #F8FAFC; border: 1.5px solid #CBD5E1; border-radius: 12px;
    padding: 16px; margin-top: 12px; display: none;
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .full { grid-column: 1 / -1; }

  .form-group { display: flex; flex-direction: column; }
  label { font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 8px; }
  
  input, select, textarea {
    width: 100%; padding: 13px 16px; border: 1.5px solid var(--border); border-radius: 10px;
    font-size: 14px; color: var(--text-main); background: #FFF; outline: none; transition: all 0.2s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(15,76,129,0.12); }
  
  .cbm-box { background: #F8FAFC; border: 1.5px dashed #CBD5E1; border-radius: 12px; padding: 20px; margin-top: 12px; }
  .cbm-row { display: grid; grid-template-columns: repeat(4, 1fr) 40px; gap: 8px; margin-bottom: 8px; align-items: end; }
  
  .btn-add-row {
    background: #E2E8F0; color: #334155; border: none; padding: 10px 14px;
    border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 6px;
  }
  .btn-add-row:hover { background: #CBD5E1; }

  .btn-del-row {
    background: #FEE2E2; color: var(--danger); border: 1px solid #FCA5A5;
    border-radius: 8px; height: 44px; font-size: 16px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-del-row:hover { background: #FCA5A5; color: #FFF; }
  
  .autocomplete-wrapper { position: relative; }
  .autocomplete-items {
    position: absolute; border: 1px solid var(--border); border-top: none; z-index: 99;
    top: 100%; left: 0; right: 0; background-color: #fff; border-radius: 0 0 10px 10px;
    max-height: 200px; overflow-y: auto; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
  }
  .autocomplete-items div { padding: 12px 16px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #F1F5F9; }
  .autocomplete-items div:hover { background-color: #F0F6FF; color: var(--primary); font-weight: 600; }

  .btn-submit {
    width: 100%; background: var(--primary); color: #FFF; border: 0; padding: 18px;
    border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s; margin-top: 32px;
  }
  .btn-submit:hover { background: var(--primary-hover); }

  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    .type-grid, .service-grid { grid-template-columns: repeat(2, 1fr); }
    .cbm-row { grid-template-columns: repeat(2, 1fr); position: relative; padding-bottom: 40px; border-bottom: 1px solid #E2E8F0; }
    .btn-del-row { position: absolute; right: 0; bottom: 8px; width: 100%; height: 32px; font-size: 13px; }
    .card { padding: 24px 18px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="logo-box">
    <img src="/logo.png" alt="와이드해운">
  </div>

  <form id="quoteForm" class="card" onsubmit="event.preventDefault(); submitQuote();">
    <div class="header-group">
      <div class="header-title-wrapper">
        
        <!-- [왼쪽] 원본 비행기 이미지 고정 (비율 유지) -->
        <span class="char-icon char-left">
          <img src="https://i.ibb.co/6RzYtG5/airplane.png" alt="비행기 캐릭터" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'140\' height=\'80\'><rect width=\'100%\' height=\'100%\' fill=\'%23e2e8f0\'/><text x=\'50%\' y=\'50%\' font-size=\'12\' fill=\'%2364748b\' text-anchor=\'middle\' dominant-baseline=\'middle\'>Airplane</text></svg>'">
        </span>

        <h1>국제운송 견적 문의</h1>

        <!-- [오른쪽] 컨테이너 캐릭터 -->
        <span class="char-icon char-right">
          <svg width="110" height="60" viewBox="0 0 160 90" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="62" y="78" width="10" height="10" rx="4" fill="#093760"/>
            <rect x="88" y="78" width="10" height="10" rx="4" fill="#093760"/>
            
            <path d="M 12 50 Q 4 54 4 60" stroke="#093760" stroke-width="4.5" stroke-linecap="round" fill="none"/>
            <circle cx="4" cy="60" r="4" fill="#093760"/>

            <path d="M 148 50 Q 156 42 158 34" stroke="#093760" stroke-width="4.5" stroke-linecap="round" fill="none"/>
            <circle cx="158" cy="34" r="4" fill="#093760"/>

            <rect x="12" y="22" width="136" height="52" rx="4" fill="#0F4C81" stroke="#093760" stroke-width="2.5"/>
            
            <rect x="12" y="22" width="6" height="6" fill="#1E5C96"/>
            <rect x="142" y="22" width="6" height="6" fill="#1E5C96"/>
            <rect x="12" y="68" width="6" height="6" fill="#1E5C96"/>
            <rect x="142" y="68" width="6" height="6" fill="#1E5C96"/>

            <line x1="28" y1="28" x2="28" y2="68" stroke="#1E5C96" stroke-width="2"/>
            <line x1="44" y1="28" x2="44" y2="68" stroke="#1E5C96" stroke-width="2"/>
            <line x1="60" y1="28" x2="60" y2="68" stroke="#1E5C96" stroke-width="2"/>

            <line x1="112" y1="22" x2="112" y2="74" stroke="#093760" stroke-width="2.5"/>
            <line x1="120" y1="34" x2="120" y2="62" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="120" cy="33" r="2" fill="#FFFFFF"/>
            <circle cx="120" cy="63" r="2" fill="#FFFFFF"/>
            <line x1="134" y1="34" x2="134" y2="62" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="134" cy="33" r="2" fill="#FFFFFF"/>
            <circle cx="134" cy="63" r="2" fill="#FFFFFF"/>

            <text x="20" y="49" fill="#FFFFFF" font-size="11" font-weight="900" font-family="sans-serif" letter-spacing="0.5">WIDE</text>
            <text x="20" y="61" fill="#FFFFFF" font-size="11" font-weight="900" font-family="sans-serif" letter-spacing="0.5">SHIPPING</text>

            <circle cx="82" cy="45" r="5.5" fill="#FFFFFF"/>
            <circle cx="102" cy="45" r="5.5" fill="#FFFFFF"/>
            <circle cx="83.5" cy="45" r="2.8" fill="#1E293B"/>
            <circle cx="103.5" cy="45" r="2.8" fill="#1E293B"/>
            <circle cx="84.5" cy="43.8" r="1" fill="#FFFFFF"/>
            <circle cx="104.5" cy="43.8" r="1" fill="#FFFFFF"/>
            
            <ellipse cx="76.5" cy="51" rx="3" ry="1.8" fill="#F43F5E" opacity="0.7"/>
            <ellipse cx="108.5" cy="51" rx="3" ry="1.8" fill="#F43F5E" opacity="0.7"/>
            <path d="M 88 50 Q 92 55 96 50" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none"/>

            <path d="M 72 22 C 72 15, 88 15, 88 22 Z" fill="#FFFFFF"/>
            <rect x="69" y="20.5" width="22" height="2.5" rx="1" fill="#CBD5E1"/>
          </svg>
        </span>

      </div>
      <p>
        하기의 화물 및 운송 정보를 입력해 주시면 담당자가 확인 후 신속히 안내드릴 수 있도록 하겠습니다.<br>
        직접 문의 필요시 wide@widesp.com / 051-816-2004 로 연락 부탁드립니다.😊
      </p>
    </div>

    <!-- 1. 운송 방식 -->
    <div class="section-title">운송 수단 선택</div>
    <div class="segment-control">
      <input type="radio" id="m_fcl" name="mode" value="해상 FCL" checked onchange="toggleMode()">
      <label for="m_fcl">🚢 해상 FCL</label>
      
      <input type="radio" id="m_lcl" name="mode" value="해상 LCL" onchange="toggleMode()">
      <label for="m_lcl">📦 해상 LCL</label>
      
      <input type="radio" id="m_air" name="mode" value="항공 운송" onchange="toggleMode()">
      <label for="m_air">✈️ 항공 운송</label>
    </div>

    <!-- 2. 구간 및 조건 -->
    <div class="section-title">운송 구간 및 조건</div>
    <div class="grid">
      <div class="form-group autocomplete-wrapper">
        <label>출발지 (Origin) *</label>
        <input id="origin" placeholder="포트명 또는 UN/LOCODE (예: BUSAN)" autocomplete="off" required>
        <div id="origin-list" class="autocomplete-items"></div>
      </div>

      <div class="form-group autocomplete-wrapper">
        <label>도착지 (Destination) *</label>
        <input id="dest" placeholder="포트명 또는 UN/LOCODE (예: LOS ANGELES)" autocomplete="off" required>
        <div id="dest-list" class="autocomplete-items"></div>
      </div>

      <div class="form-group">
        <label>인코텀즈 (Incoterms) *</label>
        <select id="inc">
          <option value="EXW">EXW (공장 인도조건)</option>
          <option value="FCA">FCA (운송인 인도조건)</option>
          <option value="FOB">FOB (본선 인도조건)</option>
          <option value="CIP">CIP (운임·보험료 지급 인도조건)</option>
          <option value="CIF">CIF (운임·보험료 포함조건)</option>
          <option value="DAP">DAP (도착 장소 인도조건)</option>
          <option value="DDP">DDP (관세 지급 인도조건)</option>
        </select>
      </div>

      <div class="form-group">
        <label>희망 출항일 (ETD)</label>
        <input id="etd" type="date">
      </div>

      <div class="form-group full">
        <label>추가 요청 서비스 (필요시 선택)</label>
        <div class="service-grid">
          <input type="checkbox" id="svc_customs" value="통관 대행 필요">
          <label for="svc_customs">
            🛃 통관 대행
            <span class="sub-text">수출 / 수입 통관</span>
          </label>

          <input type="checkbox" id="svc_trucking" value="내륙운송 필요" onchange="toggleTruckingBox()">
          <label for="svc_trucking">
            🚛 내륙 운송
            <span class="sub-text">공장/창고 픽업 및 배송</span>
          </label>

          <input type="checkbox" id="svc_insurance" value="적하보험 가입 필요">
          <label for="svc_insurance">
            🛡️ 적하보험
            <span class="sub-text">화물 손실/파손 보상</span>
          </label>
        </div>

        <div id="trucking-box" class="trucking-address-box">
          <div class="grid">
            <div class="form-group">
              <label>🚚 픽업지 주소/지역</label>
              <input id="pickup_addr" placeholder="예: 경기도 화성시 팔탄면 / 공장주소">
            </div>
            <div class="form-group">
              <label>🏢 하차지 주소/지역</label>
              <input id="drop_addr" placeholder="예: 부산시 강서구 미음동 / 창고주소">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. 화물 정보 -->
    <div class="section-title">화물 정보</div>
    <div class="grid">
      <div class="form-group full">
        <label>품목명 (Cargo Description) *</label>
        <input id="cargo" placeholder="예: 전자부품, 일반공업제품" required>
      </div>

      <div id="fcl-type-box" class="form-group full">
        <label>컨테이너 타입 선택 *</label>
        <div class="type-grid">
          <input type="radio" id="c_20dc" name="container_type" value="20DC" checked onchange="toggleContainerDim()">
          <label for="c_20dc">20DC</label>

          <input type="radio" id="c_40hq" name="container_type" value="40HQ" onchange="toggleContainerDim()">
          <label for="c_40hq">40HQ</label>

          <input type="radio" id="c_ot" name="container_type" value="20OT / 40OT" onchange="toggleContainerDim()">
          <label for="c_ot">20OT / 40OT</label>

          <input type="radio" id="c_fr" name="container_type" value="20FR / 40FR" onchange="toggleContainerDim()">
          <label for="c_fr">20FR / 40FR</label>

          <input type="radio" id="c_bulk" name="container_type" value="BULK" onchange="toggleContainerDim()">
          <label for="c_bulk">BULK</label>

          <input type="radio" id="c_unk" name="container_type" value="컨테이너 타입 미정" onchange="toggleContainerDim()">
          <label for="c_unk">타입 미정</label>
        </div>
      </div>

      <div class="form-group full">
        <label>총 중량 (Gross Weight, kg) *</label>
        <input id="weight" type="number" placeholder="예: 5000" required>
      </div>

      <div id="dim-spec-box" class="full" style="display:none;">
        <div class="cbm-box">
          <label style="color:#0F4C81; margin-bottom:12px; display:block;">📏 화물 사이즈 직접 입력 (다중 규격 추가 가능)</label>
          
          <div id="dim-container">
            <div class="cbm-row">
              <div class="form-group"><label>가로(cm)</label><input class="dim_w" type="number" placeholder="100" oninput="calcCbm()"></div>
              <div class="form-group"><label>세로(cm)</label><input class="dim_l" type="number" placeholder="100" oninput="calcCbm()"></div>
              <div class="form-group"><label>높이(cm)</label><input class="dim_h" type="number" placeholder="100" oninput="calcCbm()"></div>
              <div class="form-group"><label>수량(EA)</label><input class="dim_q" type="number" value="1" oninput="calcCbm()"></div>
              <div></div>
            </div>
          </div>

          <button type="button" class="btn-add-row" onclick="addDimRow()">+ 화물 규격 추가</button>

          <div style="margin-top: 16px;">
            <div class="form-group">
              <label id="lbl_volume">총 부피 (합산 CBM)</label>
              <input id="cbm" type="number" step="0.001" placeholder="0.000" readonly style="background:#F1F5F9; font-weight:700; color:var(--primary);">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 4. 담당자 정보 -->
    <div class="section-title">고객 및 담당자 정보</div>
    <div class="grid">
      <div class="form-group"><label>회사명 *</label><input id="company" placeholder="회사명을 입력하세요" required></div>
      <div class="form-group"><label>담당자명 *</label><input id="name" placeholder="담당자 성함을 입력하세요" required></div>
      <div class="form-group"><label>연락처 *</label><input id="phone" type="tel" placeholder="010-1234-5678" required></div>
      <div class="form-group"><label>이메일 *</label><input id="email" type="email" placeholder="example@company.com" required></div>
      <div class="form-group full">
        <label>추가 요청사항</label>
        <textarea id="memo" rows="3" placeholder="기타 특이사항이나 요청사항이 있으시면 적어주세요."></textarea>
      </div>
    </div>

    <button type="submit" id="btnSubmit" class="btn-submit">견적 문의 접수하기</button>
  </form>
</div>

<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script type="text/javascript">
  (function() {
    emailjs.init("AZNplwsjRX-VEjTqg");
  })();

  const SUPABASE_URL = window.ENV_SUPABASE_URL || 'https://YOUR_SUPABASE_PROJECT_ID.supabase.co';
  const SUPABASE_ANON_KEY = window.ENV_SUPABASE_ANON_KEY || 'YOUR_SUPABASE_ANON_KEY';
  
  let supabaseClient = null;
  if (typeof supabase !== 'undefined' && SUPABASE_URL.includes('supabase.co')) {
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  const PORTS = [
    { code: 'KRPUS', name: 'Busan', country: 'Korea' },
    { code: 'KRINC', name: 'Incheon', country: 'Korea' },
    { code: 'USLAX', name: 'Los Angeles', country: 'USA' },
    { code: 'USLGB', name: 'Long Beach', country: 'USA' },
    { code: 'USNYC', name: 'New York', country: 'USA' },
    { code: 'CNSHA', name: 'Shanghai', country: 'China' }
  ];

  function setupAutocomplete(inputId, listId) {
    const input = document.getElementById(inputId);
    const list = document.getElementById(listId);

    input.addEventListener('input', function() {
      const val = this.value.toUpperCase();
      list.innerHTML = '';
      if (!val) return;

      const matches = PORTS.filter(p => p.code.includes(val) || p.name.toUpperCase().includes(val));
      matches.forEach(p => {
        const item = document.createElement('div');
        item.innerHTML = `<b>${p.code}</b> - ${p.name}, ${p.country}`;
        item.onclick = function() {
          input.value = `${p.code} (${p.name}, ${p.country})`;
          list.innerHTML = '';
        };
        list.appendChild(item);
      });
    });

    document.addEventListener('click', (e) => { if (e.target !== input) list.innerHTML = ''; });
  }

  setupAutocomplete('origin', 'origin-list');
  setupAutocomplete('dest', 'dest-list');

  function toggleTruckingBox() {
    const chk = document.getElementById('svc_trucking').checked;
    document.getElementById('trucking-box').style.display = chk ? 'block' : 'none';
  }

  function addDimRow() {
    const container = document.getElementById('dim-container');
    const newRow = document.createElement('div');
    newRow.className = 'cbm-row';
    newRow.innerHTML = `
      <div class="form-group"><input class="dim_w" type="number" placeholder="가로" oninput="calcCbm()"></div>
      <div class="form-group"><input class="dim_l" type="number" placeholder="세로" oninput="calcCbm()"></div>
      <div class="form-group"><input class="dim_h" type="number" placeholder="높이" oninput="calcCbm()"></div>
      <div class="form-group"><input class="dim_q" type="number" value="1" oninput="calcCbm()"></div>
      <button type="button" class="btn-del-row" onclick="removeDimRow(this)">✕</button>
    `;
    container.appendChild(newRow);
  }

  function removeDimRow(btn) {
    btn.parentElement.remove();
    calcCbm();
  }

  function calcCbm() {
    const rows = document.querySelectorAll('.cbm-row');
    const isAir = document.getElementById('m_air').checked;
    let totalResult = 0;

    rows.forEach(row => {
      const w = Number(row.querySelector('.dim_w').value) || 0;
      const l = Number(row.querySelector('.dim_l').value) || 0;
      const h = Number(row.querySelector('.dim_h').value) || 0;
      const q = Number(row.querySelector('.dim_q').value) || 1;
      
      if (isAir) {
        totalResult += (w * l * h * q) / 6000;
      } else {
        totalResult += (w * l * h * q) / 1000000;
      }
    });

    document.getElementById('cbm').value = totalResult > 0 ? totalResult.toFixed(isAir ? 2 : 3) : '';
  }

  function toggleMode() {
    const isFcl = document.getElementById('m_fcl').checked;
    const isAir = document.getElementById('m_air').checked;
    
    document.getElementById('fcl-type-box').style.display = isFcl ? 'block' : 'none';

    const lblVolume = document.getElementById('lbl_volume');
    if (isAir) {
      lblVolume.innerText = 'Volume Weight (부피중량, kg)';
    } else {
      lblVolume.innerText = '총 부피 (합산 CBM)';
    }

    toggleContainerDim();
  }

  function toggleContainerDim() {
    const isFcl = document.getElementById('m_fcl').checked;
    const dimBox = document.getElementById('dim-spec-box');

    if (!isFcl) {
      dimBox.style.display = 'block';
    } else {
      const selectedType = document.querySelector('input[name="container_type"]:checked')?.value;
      const needDimTypes = ['20OT / 40OT', '20FR / 40FR', 'BULK', '컨테이너 타입 미정'];
      
      if (needDimTypes.includes(selectedType)) {
        dimBox.style.display = 'block';
      } else {
        dimBox.style.display = 'none';
      }
    }
    calcCbm();
  }

  async function submitQuote() {
    const btnSubmit = document.getElementById('btnSubmit');
    btnSubmit.disabled = true;
    btnSubmit.innerText = '접수 중...';

    const selectedMode = document.querySelector('input[name="mode"]:checked').value;
    const isFcl = document.getElementById('m_fcl').checked;
    const isAir = document.getElementById('m_air').checked;
    
    const selectedContainerType = isFcl 
      ? (document.querySelector('input[name="container_type"]:checked')?.value || '20DC')
      : '해당없음(LCL/Air)';

    let services = [];
    if (document.getElementById('svc_customs').checked) services.push("통관대행");
    
    if (document.getElementById('svc_trucking').checked) {
      const pAddr = document.getElementById('pickup_addr').value || '미입력';
      const dAddr = document.getElementById('drop_addr').value || '미입력';
      services.push(`내륙운송 (픽업: ${pAddr} / 하차: ${dAddr})`);
    }
    
    if (document.getElementById('svc_insurance').checked) services.push("적하보험");
    
    const additionalServices = services.length > 0 ? services.join("\n") : "없음";

    let dimList = [];
    const rows = document.querySelectorAll('.cbm-row');
    rows.forEach(row => {
      const w = row.querySelector('.dim_w').value;
      const l = row.querySelector('.dim_l').value;
      const h = row.querySelector('.dim_h').value;
      const q = row.querySelector('.dim_q').value || '1';

      if (w && l && h) {
        dimList.push(`${w}*${l}*${h}cm (${q}EA)`);
      }
    });

    const dimensionsFormatted = dimList.length > 0 ? dimList.join(', ') : '미입력';
    const cbmVal = document.getElementById('cbm') ? (document.getElementById('cbm').value || '0') : '0';
    const weightVal = document.getElementById('weight') ? (document.getElementById('weight').value || '0') : '0';

    const volText = isAir ? `${cbmVal} Vol.kg` : `${cbmVal} CBM`;
    const lclAirInfo = `${volText} / ${weightVal} kg / ${dimensionsFormatted}`;

    const quoteData = {
      company: document.getElementById('company').value,
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value,
      email: document.getElementById('email').value,
      mode: selectedMode,
      origin: document.getElementById('origin').value,
      dest: document.getElementById('dest').value,
      inc: document.getElementById('inc').value,
      etd: document.getElementById('etd').value || '미정',
      add_services: additionalServices,
      cargo: document.getElementById('cargo').value,
      fcl_type: selectedContainerType,
      dimensions: dimensionsFormatted,
      cbm: cbmVal,
      weight: weightVal,
      lcl_info: lclAirInfo,
      memo: document.getElementById('memo').value || '없음'
    };

    try {
      if (supabaseClient) {
        const { error } = await supabaseClient
          .from('quotes')
          .insert([quoteData]);

        if (error) console.error('Supabase 저장 에러:', error);
      }

      await emailjs.send('service_0941k49', 'template_07n0vdn', quoteData);

      alert('견적 문의가 정상 접수되었습니다.');
      location.reload();

    } catch (error) {
      console.error('견적 접수 처리 실패:', error);
      alert('견적 접수 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
      btnSubmit.disabled = false;
      btnSubmit.innerText = '견적 문의 접수하기';
    }
  }
</script>
</body>
