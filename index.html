<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>포워딩 견적문의</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,"Noto Sans KR",sans-serif}
.wrap{max-width:900px;margin:auto;padding:28px 16px}.brand{font-weight:900;font-size:21px;margin-bottom:18px}.hero{background:#17263e;color:#fff;padding:28px;border-radius:16px}.hero h1{margin:0 0 8px}.panel{background:#fff;margin-top:15px;padding:22px;border-radius:14px;border:1px solid #e2e8f0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:800;color:#667085;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #d5dce7;border-radius:8px}textarea{resize:vertical}.btn{border:0;border-radius:8px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#315bb5;color:#fff}.row{display:flex;justify-content:flex-end;margin-top:16px}.notice{background:#f2f6ff;padding:11px;border-radius:8px;font-size:13px;color:#31518f}.success{text-align:center;padding:35px}.code{font-size:25px;color:#315bb5;font-weight:900;margin:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><main class="wrap"><div class="brand">🚢 Forwarding Quote</div>
<section id="form"><div class="hero"><h1>포워딩 운송 견적문의</h1><div>운송 정보를 입력해 주세요. 담당자가 확인 후 견적을 안내드립니다.</div></div>
<div class="panel"><h2>고객 정보</h2><div class="grid">
<div><label>회사명 *</label><input id="company"></div><div><label>담당자명 *</label><input id="name"></div>
<div><label>연락처 *</label><input id="phone"></div><div><label>이메일 *</label><input id="email" type="email"></div></div></div>
<div class="panel"><h2>운송 정보</h2><div class="grid">
<div><label>출발지 *</label><input id="origin" placeholder="BUSAN"></div><div><label>도착지 *</label><input id="dest" placeholder="LOS ANGELES"></div>
<div><label>운송</label><select id="mode"><option>해상</option><option>항공</option></select></div><div><label>서비스</label><select id="service"><option>FCL</option><option>LCL</option><option>특송</option></select></div>
<div><label>화물</label><input id="cargo"></div><div><label>수량</label><input id="qty"></div><div><label>중량(kg)</label><input id="weight"></div><div><label>CBM</label><input id="cbm"></div>
<div><label>인코텀즈</label><select id="inc"><option>FOB</option><option>CIF</option><option>EXW</option><option>DDP</option><option>FCA</option></select></div><div><label>희망 출항일</label><input id="etd" type="date"></div>
<div class="full"><label>요청사항</label><textarea id="memo" rows="4"></textarea></div></div></div>
<div class="panel"><h2>개인정보 수집 및 이용</h2><div class="notice">견적문의 접수 및 답변을 위해 입력하신 정보를 이용합니다. 실제 운영 전 개인정보 처리방침과 보관기간을 회사 정책에 맞게 확정하세요.</div>
<label style="margin-top:12px;font-weight:500"><input id="agree" type="checkbox" style="width:auto"> 개인정보 수집 및 이용에 동의합니다. *</label><div class="row"><button class="btn primary" onclick="submitQuote()">견적문의 접수</button></div></div></section>
<section id="done" class="panel success" style="display:none"><div style="font-size:40px">✅</div><h2>문의가 접수되었습니다.</h2><div id="code" class="code"></div><p>담당자가 확인 후 연락드리겠습니다.</p></section>
</main><script>
let cfg;
async function getCfg(){const r=await fetch('/api/config');cfg=await r.json();if(!cfg.supabaseUrl)alert('관리자가 아직 Supabase 환경변수를 설정하지 않았습니다.');}
async function submitQuote(){
 const ids=['company','name','phone','email','origin','dest'];if(ids.some(id=>!document.getElementById(id).value.trim()))return alert('필수 항목을 입력해주세요.');
 if(!document.getElementById('agree').checked)return alert('개인정보 수집 및 이용에 동의해주세요.');
 const payload={company:company.value,name:name.value,phone:phone.value,email:email.value,origin:origin.value,dest:dest.value,mode:mode.value,service:service.value,cargo:cargo.value,qty:qty.value,weight:weight.value,cbm:cbm.value,inc:inc.value,etd:etd.value,memo:memo.value,status:'견적작성'};
 const r=await fetch(cfg.supabaseUrl+'/rest/v1/quote_inquiries',{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.supabasePublishableKey,'Prefer':'return=representation'},body:JSON.stringify(payload)});
 if(!r.ok)return alert('접수 중 오류가 발생했습니다. 관리자 설정을 확인해주세요.');
 const rows=await r.json();document.getElementById('form').style.display='none';document.getElementById('done').style.display='block';document.getElementById('code').textContent=rows[0].inquiry_no;
}
getCfg();
</script></body></html>
